<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsiConecta - Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header>
    <div class="logo">Psi<span>Conecta</span></div>
    <div class="menu-area">
      <nav>
        <a href="inicio.html">Home</a>
        <a href="sobre.html">Sobre Nós</a>
      </nav>
      <div class="buttons">
        <button class="btn btn-entrar">ENTRAR</button>
        <a href="cadastro.html" class="btn btn-cadastrar">CADASTRAR</a>
      </div>
    </div>
  </header>

    <!-- Conteúdo principal -->
    <main>
        <div class="form-container">
            <img src="Vector.png" alt="Logo PsiConecta" class="logo-form">
            

            <form>
                <label for="nome">NOME</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">EMAIL</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">SENHA</label>
                <input type="password" id="senha" name="senha" required>

                <label for="confirmar-senha">CONFIRMAR SENHA</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha" required>

                <button type="submit" class="btn-form">Cadastrar-se</button>
            </form>

            <p class="login-link">Já tem conta? <a href="#">Entre aqui</a></p>
        </div>
    </main>
</body>
</html>
