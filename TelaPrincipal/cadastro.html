<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsiConecta - Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <div class="logo">
            <span class="psi">Psi</span><span class="conecta">Conecta</span>
        </div>
        <nav>
            <a href="inicio.html">Home</a>
            <a href="sobre.html">Sobre Nós</a>
        </nav>
        <div class="botoes">
            <button class="btn-entrar">ENTRAR</button>
            <button class="btn-cadastrar">CADASTRAR</button>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <div class="form-container">
            <img src="Vector.png" alt="Logo PsiConecta" class="logo-form">
            

            <form>
                <label for="nome">NOME</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">EMAIL</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">SENHA</label>
                <input type="password" id="senha" name="senha" required>

                <label for="confirmar-senha">CONFIRMAR SENHA</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha" required>

                <button type="submit" class="btn-form">Cadastrar-se</button>
            </form>

            <p class="login-link">Já tem conta? <a href="#">Entre aqui</a></p>
        </div>
    </main>
</body>
</html>
