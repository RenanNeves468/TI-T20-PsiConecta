<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsiConecta - Cadastro</title>
    <link rel="stylesheet" href="telaLogn.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <div class="logo">
            <span class="psi">Psi</span><span class="conecta">Conecta</span>
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Sobre Nós</a>
        </nav>
        <div class="botoes">
            <button class="btn-entrar">ENTRAR</button>
            <button class="btn-cadastrar">CADASTRAR</button>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <div class="form-container">
            <img src="vector.png" alt="Logo PsiConecta" class="logo-form">
            <h2>LOGIN</h2>

            <form>
                <label for="nome">LOGN</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">SENHA</label>
                <input type="email" id="email" name="email" required>

                <p class="login-link esqueceu-senha"><a href="#">Esqueceu a senha?</a></p>


                <button type="submit" class="btn-form">ENTRAR</button>
            </form>

            <p class="login-link">Não tem uma conta? <a href="#">Inscrever-se</a></p>
        </div>
    </main>
</body>
</html>
